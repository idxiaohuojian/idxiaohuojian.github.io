<!DOCTYPE html>
<html lang="{{ site.lang | default: 'zh-CN' }}">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% if page.title %}{{ page.title }} · {% endif %}{{ site.title }}</title>
  <meta name="description" content="{% if page.description %}{{ page.description }}{% else %}{{ site.description }}{% endif %}">
  <link rel="canonical" href="{{ site.url }}{{ page.url }}">
  <link rel="alternate" type="application/rss+xml" title="{{ site.title }}" href="{{ site.url }}/feed.xml">
  <link rel="stylesheet" href="{{ site.url }}/assets/css/style.css">
</head>
<body>
  <header class="site-header">
    <div class="container">
      <a href="{{ site.url }}" class="site-title">🚀 {{ site.title }}</a>
      <nav>
        <a href="{{ site.url }}/">首页</a>
        <a href="{{ site.url }}/articles/">文章</a>
        <a href="{{ site.url }}/sitemap.xml">Sitemap</a>
      </nav>
    </div>
  </header>

  <main class="container">
    {{ content }}
  </main>

  <footer class="site-footer">
    <div class="container">
      <p>© {{ site.time | date: '%Y' }} {{ site.title }} · <a href="https://github.com/{{ site.author.name }}">{{ site.author.name }}</a></p>
    </div>
  </footer>
</body>
</html>
